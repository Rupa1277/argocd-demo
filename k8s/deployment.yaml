apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-tracker
  labels:
    app: feature-tracker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: feature-tracker

  template:
    metadata:
      labels:
        app: feature-tracker

    spec:
      containers:
      containers:
        - name: feature-tracker
          image: rupa1277/feature-tracker:8
          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: feature-tracker-svc

spec:
  selector:
    app: feature-tracker

  ports:
    - port: 80
      targetPort: 5000

  type: ClusterIP