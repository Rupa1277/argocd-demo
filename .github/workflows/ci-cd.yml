name: CI-CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: app
        run: pytest -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:latest

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: .*flask-demo:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:${{ github.run_number }}|" k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "CI: release image tag ${{ github.run_number }}" || echo "No changes to commit"
          git push