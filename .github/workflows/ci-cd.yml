name: CI-CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "app/**"

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. CHECKOUT CODE
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # 2. SET UP PYTHON
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # 3. INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # =========================
      # 4. RUN TESTS
      # =========================
      - name: Run tests
        working-directory: ./app
        run: |
          python -m pytest -v

      # =========================
      # 5. LOGIN TO DOCKER HUB
      # =========================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # 6. BUILD AND PUSH IMAGE
      # =========================
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:latest

      # =========================
      # 7. UPDATE KUBERNETES MANIFEST
      # =========================
      - name: Update image tag in manifest
        run: |
          echo "Current directory:"
          pwd

          echo "Checking Kubernetes directory:"
          ls -la k8s

          echo "Updating image tag..."

          sed -i "s|image: .*flask-demo:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:${{ github.run_number }}|" k8s/deployment.yaml

          echo "Updated deployment.yaml:"
          cat k8s/deployment.yaml

      # =========================
      # 8. COMMIT UPDATED MANIFEST
      # =========================
      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add k8s/deployment.yaml

          git diff --cached --quiet || git commit -m "CI: release image tag ${{ github.run_number }}"

          git push